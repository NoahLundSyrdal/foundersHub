name: Office validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    name: Office checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OFFICE_MODEL: mock
      ODA_FOOD_ENABLED: 'false'
      TAVILY_API_KEY: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: npm ci
      - run: npm run setup:python
      - run: npm run check
      - run: npm run build
      - run: npx tsx --test apps/web/tests/*.test.ts
      - run: npm test
      - run: npm run test:procurement
      - run: python3 scripts/cloud-development-tests.py
      - run: python3 -m unittest discover -s scripts/tests
