[project]
name = "office-agent"
version = "0.1.0"
description = "Office assistant backend: FastAPI + Pydantic AI + SQLite"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[anthropic]>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "office-procurement",
    "pydantic-ai-harness[notion]>=0.66.0",
]

[project.optional-dependencies]
# Speech-to-text + speaker ID. Owner: voice. setuptools<81 is needed by webrtcvad (resemblyzer).
voice = ["openai>=1.50", "resemblyzer>=0.1.4", "setuptools<81", "soundfile>=0.12", "numpy"]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4", "httpx>=0.28"]

[tool.uv.sources]
office-procurement = { path = "../procurement", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["office"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
