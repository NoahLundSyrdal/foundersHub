[project]
name = "office-agent"
version = "0.1.0"
description = "Office assistant backend: FastAPI + Pydantic AI + SQLite"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[anthropic]>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "httpx>=0.28",  # speaker ID client (apps/voiceid)
    "office-procurement",
    "pydantic-ai-harness[notion]>=0.66.0",
    "agentmail>=2.0.23,<3",
]

[project.optional-dependencies]
# Speech-to-text. Owner: voice. Speaker ID runs in apps/voiceid (Modal) and needs no extra here.
voice = ["openai>=1.50"]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4", "httpx>=0.28"]

[tool.uv.sources]
office-procurement = { path = "../procurement", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["office"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
