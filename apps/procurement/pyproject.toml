[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "office-procurement"
version = "0.1.0"
requires-python = ">=3.11"
description = "Bounded, read-only procurement interpretation worker"
dependencies = ["pydantic-ai-slim[anthropic]==2.66.0", "mcp==1.30.0"]

[tool.setuptools.packages.find]
include = ["office_procurement*"]
